<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-brand"><div class="login-mark" aria-hidden="true">S</div><p>Songhoï Collection</p></div>
    <h1 id="login-title">Connexion</h1><p class="login-subtitle">Accédez à votre espace de gestion.</p>
    @if (errorMessage()) { <div class="login-alert" role="alert">{{ errorMessage() }}</div> }
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <label for="loginAccessCode">Code d’accès<input id="loginAccessCode" type="text" formControlName="accessCode" autocomplete="username" placeholder="SON-482731" />@if (accessCodeCtrlInvalid()) { <small>Le code d’accès est obligatoire.</small> }</label>
      <label for="loginPassword">Mot de passe<div class="password-field"><input id="loginPassword" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="Votre mot de passe" /><button type="button" (click)="togglePassword()" [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"><i class="fa-solid" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i></button></div>@if (passwordCtrlInvalid()) { <small>Le mot de passe est obligatoire (6 caractères minimum).</small> }</label>
      <button class="login-submit" type="submit" [disabled]="isLoading()">@if (isLoading()) { Connexion… } @else { Se connecter }</button>
    </form>
  </section>
</main>
